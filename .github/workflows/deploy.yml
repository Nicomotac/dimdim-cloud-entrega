name: Build, test and deploy DimDim
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dimdim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar e executar testes
        run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v4
        with:
          name: dimdim-jar
          path: target/app.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dimdim-jar
          path: package
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: package/app.jar
      - name: Verificar saúde do app e conexão SQL
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              "https://${WEBAPP}.azurewebsites.net/actuator/health" > health.json \
              && jq -e '.status == "UP"' health.json; then
              exit 0
            fi
            sleep 10
          done
          echo 'App/SQL sem saúde UP. Confira logs de inicialização, credenciais e firewall SQL.' >&2
          exit 1
