name: Build, test and deploy DimDim

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dimdim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e executar testes
        run: mvn -B -ntp verify

      - name: Armazenar aplicação compilada
        uses: actions/upload-artifact@v4
        with:
          name: dimdim-jar
          path: target/app.jar
          if-no-files-found: error

      - name: Armazenar relatórios de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Baixar aplicação compilada
        uses: actions/download-artifact@v4
        with:
          name: dimdim-jar
          path: package

      - name: Deploy no Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: package/app.jar

      - name: Verificar saúde do app e conexão SQL
        env:
          WEBAPP: ${{ vars.AZURE_WEBAPP_NAME }}
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 10 --max-time 20 \
              "https://${WEBAPP}.azurewebsites.net/actuator/health" > health.json \
              && jq -e '.status == "UP"' health.json; then
              exit 0
            fi
            sleep 10
          done

          echo 'App/SQL sem saúde UP. Confira logs de inicialização, credenciais e firewall SQL.' >&2
          exit 1
